<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Audio Scam Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container">
        <div class="app-container">
            <header class="app-header">
                <h1><span class="rocket-icon">🚀</span> Real-Time Audio Scam Detector</h1>
                <p class="header-subtitle">Record or upload audio to detect potential scams in real-time</p>
            </header>

            <div class="app-content">
                <div class="row">
                    <div class="col-md-4">
                        <div class="card audio-input-card">
                            <div class="card-header d-flex align-items-center">
                                <h5 class="mb-0">Record or Upload Audio</h5>
                                <button type="button" class="btn-close ms-auto" aria-label="Close" id="clearAudio" style="display: none;"></button>
                            </div>
                            <div class="card-body">
                                <div class="audio-controls">
                                    <button id="recordButton" class="btn control-btn record-btn">
                                        <i data-feather="mic"></i> Record
                                    </button>
                                    <div class="or-divider">OR</div>
                                    <label for="audioFileInput" class="btn control-btn upload-btn">
                                        <i data-feather="upload"></i> Upload
                                    </label>
                                    <input type="file" id="audioFileInput" accept="audio/*" class="d-none">
                                </div>
                                <div class="recording-status" style="display: none;">
                                    <div class="recording-indicator">
                                        <div class="recording-dot"></div>
                                        <span>Recording...</span>
                                    </div>
                                    <button id="stopButton" class="btn btn-danger btn-sm">
                                        <i data-feather="square"></i> Stop
                                    </button>
                                </div>
                                <div id="audioPreview" class="mt-3" style="display: none;">
                                    <audio id="audioPlayer" controls class="w-100"></audio>
                                    <div class="file-info mt-2" id="fileInfo"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="card transcription-card">
                            <div class="card-header">
                                <h5 class="mb-0">Transcription</h5>
                            </div>
                            <div class="card-body">
                                <div id="transcriptionOutput" class="transcription-output">
                                    <div class="placeholder-text">Transcription will appear here...</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="card prediction-card">
                            <div class="card-header">
                                <h5 class="mb-0">Prediction</h5>
                            </div>
                            <div class="card-body">
                                <div id="predictionOutput" class="prediction-output">
                                    <div class="placeholder-text">Analysis result will appear here...</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="action-row">
                    <button id="analyzeButton" class="btn btn-primary analyze-btn" disabled>
                        <i data-feather="search"></i> Analyze Audio
                    </button>
                </div>

                <div id="loadingIndicator" class="loading-indicator" style="display: none;">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <span class="loading-text">Processing your audio...</span>
                </div>

                <div id="errorMessage" class="alert alert-danger mt-3" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="{{ url_for('static', filename='js/recorder.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
