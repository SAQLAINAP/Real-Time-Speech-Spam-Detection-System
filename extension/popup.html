<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScamShield</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      background: #111827;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
    }
    .header {
      background: #1f2937;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 { font-size: 15px; font-weight: 700; }
    .header p  { font-size: 11px; color: #6b7280; margin-top: 2px; }
    .body { padding: 14px 16px; }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1f2937;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .status-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #4b5563;
      animation: none;
    }
    .status-dot.active {
      background: #10b981;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; } 50% { opacity: 0.3; }
    }
    .status-label { font-size: 12px; color: #9ca3af; }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-bottom: 8px;
    }
    .btn:hover { opacity: 0.85; }
    .btn-start { background: #10b981; color: white; }
    .btn-stop  { background: #ef4444; color: white; display: none; }

    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #4b5563;
      margin-bottom: 6px;
    }
    .input-group { margin-bottom: 12px; }
    input {
      width: 100%;
      background: #1f2937;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 7px 10px;
      color: #f3f4f6;
      font-size: 12px;
      outline: none;
    }
    input:focus { border-color: #6366f1; }
    .save-btn {
      background: #6366f1;
      color: white;
      padding: 7px 14px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      margin-top: 6px;
      float: right;
    }
    .save-btn:hover { background: #4f46e5; }
    .saved-msg { color: #10b981; font-size: 11px; display: none; margin-top: 6px; }

    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.06);
      margin: 12px 0;
    }
    .footer {
      text-align: center;
      font-size: 10px;
      color: #374151;
      padding-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>🛡️ ScamShield</h1>
      <p>Real-time call protection</p>
    </div>
  </div>

  <div class="body">
    <div class="status-row">
      <div style="display:flex;align-items:center;gap:8px">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-label" id="statusLabel">Not monitoring</span>
      </div>
    </div>

    <button class="btn btn-start" id="startBtn">▶ Start Monitoring</button>
    <button class="btn btn-stop"  id="stopBtn">■ Stop Monitoring</button>

    <hr class="divider">

    <div class="section-title">Settings</div>

    <div class="input-group">
      <div class="section-title" style="margin-bottom:4px">Backend URL</div>
      <input type="text" id="backendUrl" placeholder="http://localhost:5000">
    </div>

    <div class="input-group">
      <div class="section-title" style="margin-bottom:4px">API Key (optional)</div>
      <input type="password" id="apiKey" placeholder="sk-...">
    </div>

    <button class="save-btn" id="saveBtn">Save</button>
    <div class="saved-msg" id="savedMsg">✓ Saved</div>

    <hr class="divider" style="clear:both">

    <div class="footer">Works on Google Meet · Zoom · Teams</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
